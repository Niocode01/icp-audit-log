<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebulock Audit Log</title>
<style>
  :root {
    --bg: #0a0e14; --surface: #131820; --border: #1e2836;
    --text: #c8d6e5; --muted: #5c6e84; --accent: #39bae6;
    --green: #7fd962; --yellow: #ffb454; --red: #f26d78; --purple: #d2a6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:monospace; min-height:100vh; }
  header { background:var(--surface); border-bottom:1px solid var(--border); padding:20px 32px; display:flex; justify-content:space-between; }
  header h1 { font-size:18px; color:var(--accent); }
  .canister { font-size:12px; color:var(--muted); }
  .controls { padding:16px 32px; display:flex; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--surface); }
  .controls select, .controls button, .controls input { background:var(--bg); color:var(--text); border:1px solid var(--border); padding:8px 14px; border-radius:6px; font:13px monospace; }
  .controls button { background:var(--accent); color:var(--bg); border:none; font-weight:600; cursor:pointer; }
  .stats { display:flex; gap:24px; padding:16px 32px; font-size:13px; color:var(--muted); }
  .stats b { color:var(--accent); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:12px 32px; font-size:11px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); }
  td { padding:10px 32px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover td { background:var(--surface); }
  .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
  .bt { background:#1a2733; color:var(--accent); }
  .bl { background:#1a2e1a; color:var(--green); }
  .bs { background:#2e2a1a; color:var(--yellow); }
  .bu { background:#1a1a2e; color:var(--purple); }
  .bd { background:#2e1a1a; color:var(--red); }
  .hash { font-size:11px; color:var(--muted); }
  .meta { font-size:11px; color:var(--muted); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .time { font-size:12px; color:var(--muted); white-space:nowrap; }
  .empty { text-align:center; padding:60px; color:var(--muted); }
  .loading { text-align:center; padding:40px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { animation:spin 1s infinite; display:inline-block; }
  .pagination { display:flex; gap:8px; align-items:center; justify-content:center; padding:16px; flex-wrap:wrap; }
  .pagination button { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:8px 16px; border-radius:6px; cursor:pointer; font:13px monospace; }
  .pagination button:hover { background:var(--accent); color:var(--bg); }
  .pagination button.on { background:var(--accent); color:var(--bg); font-weight:600; }
  .pagination button:disabled { opacity:0.3; cursor:default; }
  .pagination span { font-size:12px; color:var(--muted); }
  footer { text-align:center; padding:16px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Nebulock Audit Log</h1>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">Append-only | Immutable | ICP Mainnet</div>
  </div>
  <div class="canister" style="text-align:right">Canister<br><span style="color:var(--accent)">s7oui-qqaaa-aaaag-ayx2a-cai</span></div>
</header>
<div class="controls">
  <select id="fa" onchange="loadPage(1)"><option value="">All agents</option></select>
  <select id="ft" onchange="loadPage(1)"><option value="">All types</option></select>
  <input id="q" placeholder="Search metadata..." oninput="render()">
  <button onclick="loadPage(currentPage)">Refresh</button>
  <span style="font-size:12px;color:var(--muted);margin-left:auto" id="as">Auto: 30s</span>
</div>
<div class="stats">
  <div>Total: <b id="st">-</b></div>
  <div>Showing: <b id="ss">-</b></div>
  <div>Last: <b id="sl">-</b></div>
</div>
<table>
  <thead><tr><th style="width:60px">#</th><th style="width:110px">Agent</th><th style="width:140px">Type</th><th>Hash</th><th>Metadata</th><th style="width:160px">Timestamp</th></tr></thead>
  <tbody id="tb"><tr><td colspan="6" class="loading"><span class="spinner">*</span> Loading from IC mainnet...</td></tr></tbody>
</table>
<div class="pagination" id="pg"></div>
<footer>
  <a href="https://dashboard.internetcomputer.org/canister/s7oui-qqaaa-aaaag-ayx2a-cai" target="_blank">IC Dashboard</a>
  |
  <a href="https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.ic0.app/?id=s7oui-qqaaa-aaaag-ayx2a-cai" target="_blank">Candid UI</a>
</footer>
<script>
var PP=200,CP=1,TP=1,TE=0,entries=[],AR=true;
function bc(t){if(!t)return'bs';if(t.indexOf('tool')===0)return'bt';if(t.indexOf('llm')>=0)return'bl';if(t.indexOf('session')>=0)return'bs';if(t.indexOf('deploy')>=0)return'bd';return'bu';}
function fmt(ms){var d=new Date(ms);return d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function mp(m){if(!m)return'-';if(m.content_preview)return m.content_preview.substring(0,80);if(m.tool)return 'T: '+m.tool;if(m.session)return 'S: '+m.session;if(typeof m==='string')return m.substring(0,80);return JSON.stringify(m).substring(0,80);}
function es(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function loadPage(p){
  try{
    var r=await fetch('/api/entries?page='+p);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json();
    entries=d.entries;CP=d.pagination.page;TP=d.pagination.total_pages;TE=d.pagination.total;
    if(p===1){
      var sr=await fetch('/api/stats');
      var sd=await sr.json();
      document.getElementById('fa').innerHTML='<option value="">All agents</option>'+sd.agents.map(function(a){return'<option>'+a+'</option>';}).join('');
      document.getElementById('ft').innerHTML='<option value="">All types</option>'+sd.types.map(function(t){return'<option>'+t+'</option>';}).join('');
    }
    render();
  }catch(e){
    document.getElementById('tb').innerHTML='<tr><td colspan="6" class="empty">Error: '+e.message+'</td></tr>';
  }
}

function goPage(p){if(p<1||p>TP)return;CP=p;loadPage(p);window.scrollTo(0,0);}

function renderPagination(){
  var pg=document.getElementById('pg');
  if(TP<=1){pg.innerHTML='';return;}
  var h='';
  h+='<button onclick="goPage('+(CP-1)+')" '+(CP<=1?'disabled':'')+'>Prev</button> ';
  var ms=Math.max(1,CP-3),me=Math.min(TP,CP+3);
  if(ms>1){h+='<button onclick="goPage(1)">1</button>';if(ms>2)h+='<span>...</span>';}
  for(var i=ms;i<=me;i++)h+='<button onclick="goPage('+i+')" class="'+(i===CP?'on':'')+'">'+i+'</button>';
  if(me<TP){if(me<TP-1)h+='<span>...</span>';h+='<button onclick="goPage('+TP+')">'+TP+'</button>';}
  h+=' <button onclick="goPage('+(CP+1)+')" '+(CP>=TP?'disabled':'')+'>Next</button>';
  h+=' <span>'+CP+' / '+TP+' - '+TE+' total</span>';
  pg.innerHTML=h;
}

function render(){
  var af=document.getElementById('fa').value;
  var tf=document.getElementById('ft').value;
  var q=document.getElementById('q').value.toLowerCase();
  var fl=entries;
  if(af)fl=fl.filter(function(e){return e.agent_id===af;});
  if(tf)fl=fl.filter(function(e){return e.action_type===tf;});
  if(q)fl=fl.filter(function(e){return JSON.stringify(e.metadata||'').toLowerCase().indexOf(q)>=0;});
  document.getElementById('st').textContent=TE;
  document.getElementById('ss').textContent=fl.length;
  if(entries.length>0)document.getElementById('sl').textContent=fmt(entries[0].timestamp_ms);
  var tb=document.getElementById('tb');
  if(fl.length===0){tb.innerHTML='<tr><td colspan="6" class="empty">No entries</td></tr>';renderPagination();return;}
  tb.innerHTML=fl.map(function(e){
    return'<tr><td>'+e.index+'</td><td><b>'+es(e.agent_id)+'</b></td><td><span class="badge '+bc(e.action_type)+'">'+es(e.action_type)+'</span></td><td class="hash">'+es(e.action_hash)+'</td><td class="meta" title="'+es(JSON.stringify(e.metadata||''))+'">'+es(mp(e.metadata))+'</td><td class="time">'+fmt(e.timestamp_ms)+'</td></tr>';
  }).join('');
  renderPagination();
}

loadPage(1);
setInterval(function(){if(AR)loadPage(CP);},30000);
document.getElementById('q').addEventListener('focus',function(){AR=false;});
document.getElementById('q').addEventListener('blur',function(){AR=true;});
</script>
</body>
</html>
